<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Screenshot">
  <!--
    Scissors, standing upright — the same mark the launcher button and the toolbar use.

    The button's glyph is horizontal (rings left, blades right); here it is the same geometry
    rotated 90° clockwise so the silhouette is tall, which sits better in the square tile the
    Plugin Manager draws. Every coordinate below is the 24-unit button path scaled by 1.5,
    centred, then rotated: (x, y) → (36 − y, x).

    Rings sit at y≈8.4 (r 3.45, spanning x 8.1..27.9), blades start at y 15 and cross near
    (18, 22.5), ending at y 30.45 — inside the box with a 5.5-unit margin.
  -->
  <g fill="none" stroke="#2f6fe4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24.45" cy="8.4" r="3.45"/>
    <circle cx="11.55" cy="8.4" r="3.45"/>
    <path d="M21.45 15 11.4 30.45"/>
    <path d="M14.55 15 24.6 30.45"/>
  </g>
</svg>
